name: nightly
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: |
          pip install -r requirements.txt
          pip install -e packages/kilithattu-core -e packages/kilithattu-agents -e packages/kilithattu-game
          pip install -e packages/kilithattu-train -e packages/kilithattu-eval --no-deps
      - name: Slow suites (league, FCP, BC, curriculum, tournament, balance)
        env: { SDL_VIDEODRIVER: dummy }
        run: pytest packages -m nightly
