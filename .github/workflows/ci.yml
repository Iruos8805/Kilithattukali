name: ci
on: [push, pull_request]
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e packages/kilithattu-core -e packages/kilithattu-agents -e packages/kilithattu-game
          pip install -e packages/kilithattu-train -e packages/kilithattu-eval --no-deps
      - name: Lint
        run: ruff check packages
      - name: Rules engine, agents and game tests
        env: { SDL_VIDEODRIVER: dummy, SDL_AUDIODRIVER: dummy }
        run: pytest packages/kilithattu-core packages/kilithattu-agents packages/kilithattu-game -m "not nightly"
      - name: Cheap train/eval unit tests
        run: pytest packages/kilithattu-train packages/kilithattu-eval -m "not nightly"
