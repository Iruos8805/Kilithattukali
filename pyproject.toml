[project]
name = "kilithattu-workspace"
version = "0.1.0"
description = "Kilithattu-RL: Multi-Agent RL and Playable Game for Kerala's Traditional Onam Game"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kilithattu-core",
    "kilithattu-agents",
    "kilithattu-train",
    "kilithattu-eval",
    "kilithattu-game",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "import-linter>=2.0",
    "ruff>=0.6.0",
]

[tool.uv.workspace]
members = [
    "packages/kilithattu-core",
    "packages/kilithattu-agents",
    "packages/kilithattu-train",
    "packages/kilithattu-eval",
    "packages/kilithattu-game",
]

[tool.uv.sources]
kilithattu-core = { workspace = true }
kilithattu-agents = { workspace = true }
kilithattu-train = { workspace = true }
kilithattu-eval = { workspace = true }
kilithattu-game = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "packages/kilithattu-core/tests",
    "packages/kilithattu-agents/tests",
    "packages/kilithattu-train/tests",
    "packages/kilithattu-eval/tests",
    "packages/kilithattu-game/tests",
]
pythonpath = [
    "packages/kilithattu-core/src",
    "packages/kilithattu-agents/src",
    "packages/kilithattu-train/src",
    "packages/kilithattu-eval/src",
    "packages/kilithattu-game/src",
]
