[project]
name = "kilithattu-game"
version = "0.1.0"
description = "Interactive pygame-ce client, HUD, sound, and visualizer for Kilithattu Kali"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kilithattu-core",
    "kilithattu-agents",
    "pygame-ce>=2.4.0",
]

[project.scripts]
kilithattu-game = "kilithattu_game.app:main"
kilithattu = "kilithattu_game.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kilithattu_game"]
