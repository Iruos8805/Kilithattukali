[project]
name = "kilithattu-eval"
version = "0.1.0"
description = "Evaluation, tournaments, Elo, Nash averaging, and game balancing for Kilithattu Kali"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kilithattu-core",
    "kilithattu-agents",
    "kilithattu-train",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
]

[project.scripts]
kilithattu-eval = "kilithattu_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kilithattu_eval"]
