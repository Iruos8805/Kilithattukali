[project]
name = "kilithattu-agents"
version = "0.1.0"
description = "Policies, scripted bots, neural architectures, and checkpoint management for Kilithattu Kali"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kilithattu-core",
    "flax>=0.8.0",
    "distrax>=0.1.5",
    "huggingface_hub>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kilithattu_agents"]
