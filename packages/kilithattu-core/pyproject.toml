[project]
name = "kilithattu-core"
version = "0.1.0"
description = "Core formal rules engine, geometry, and vectorised JAX simulation for Kilithattu Kali"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.28",
    "chex>=0.1.86",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kilithattu_core"]
