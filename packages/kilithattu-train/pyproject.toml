[project]
name = "kilithattu-train"
version = "0.1.0"
description = "Multi-Agent PPO (MAPPO), curriculum, self-play league, and FCP training for Kilithattu Kali"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kilithattu-core",
    "kilithattu-agents",
    "optax>=0.2.0",
]

[project.scripts]
kilithattu-train = "kilithattu_train.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kilithattu_train"]
